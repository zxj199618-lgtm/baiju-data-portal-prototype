name: guanxingta-prototype

services:
  analysis-gateway:
    build: .
    container_name: guanxingta-gateway
    ports:
      - "8787:8787"
    environment:
      RELAY_BASE_URL: "https://simindapi.modelgs.com"
      RELAY_API_KEY: "${RELAY_API_KEY:?请在 .env 中设置 RELAY_API_KEY（多个 key 用英文逗号分隔）}"
      PORT: "8787"
      PORTAL_INITIAL_PASSWORD: "${PORTAL_INITIAL_PASSWORD:-}"
      PORTAL_AUTH_SECRET: "${PORTAL_AUTH_SECRET:-}"
      PORTAL_ALLOWED_ORIGINS: "${PORTAL_ALLOWED_ORIGINS:-}"
      PORTAL_DAILY_REQUEST_LIMIT: "${PORTAL_DAILY_REQUEST_LIMIT:-}"
      PORTAL_DAILY_TOKEN_LIMIT: "${PORTAL_DAILY_TOKEN_LIMIT:-}"
      PORTAL_DEMO_LOGIN_PASSWORD: "${PORTAL_DEMO_LOGIN_PASSWORD:-}"
      PORTAL_GLOBAL_DAILY_TOKEN_LIMIT: "${PORTAL_GLOBAL_DAILY_TOKEN_LIMIT:-}"
      DATA_DIR: "/app/data"
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped

volumes:
  gateway-data:
