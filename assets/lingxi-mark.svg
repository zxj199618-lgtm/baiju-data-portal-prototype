<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="lx-bg" x1="6" y1="2" x2="42" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="55%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <radialGradient id="lx-glow" cx="50%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lx-rim" x1="24" y1="1" x2="24" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="lx-orbit" x1="8" y1="34" x2="40" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="lx-star" x1="24" y1="11" x2="24" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E4E7"/>
    </linearGradient>
  </defs>
  <!-- Squircle 底座 -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="url(#lx-bg)"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="url(#lx-glow)"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="13" stroke="url(#lx-rim)" stroke-width="1"/>
  <!-- 观星数据轨道 -->
  <ellipse cx="24" cy="24" rx="16.5" ry="6.8" transform="rotate(-28 24 24)" stroke="url(#lx-orbit)" stroke-width="1.35"/>
  <!-- 灵犀四芒主星 -->
  <path d="M24 11.2C24.9 18.6 29.4 23.1 36.8 24C29.4 24.9 24.9 29.4 24 36.8C23.1 29.4 18.6 24.9 11.2 24C18.6 23.1 23.1 18.6 24 11.2Z" fill="url(#lx-star)"/>
  <!-- 右上伴星 -->
  <circle cx="35.6" cy="14.2" r="2.1" fill="#FFFFFF"/>
  <!-- 左下微光点 -->
  <circle cx="13.4" cy="33.4" r="1.1" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
